<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexus Vision One - Dashboard</title>
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Animações */
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Estilos para a análise */
        .analysis-progress {
            text-align: center;
            padding: 1.5rem;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 3px;
            animation: progress 5s linear forwards;
        }

        .threats-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .threat-level {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .threat-critical {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .threat-high {
            background-color: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .threat-medium {
            background-color: rgba(234, 179, 8, 0.2);
            color: #eab308;
        }

        .fix-step {
            position: relative;
            transition: all 0.3s;
        }

        .step-icon {
            font-size: 1.5rem;
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .fix-complete {
            padding: 2rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="bg-darker">
    <!-- Container principal com sidebar e conteúdo -->
    <div class="app-container">
        <!-- Sidebar lateral -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-r from-blue-500 to-purple-600 flex items-center justify-center mr-3">
                        <i class="fas fa-shield-alt text-white"></i>
                    </div>
                    <h1 class="text-xl font-bold orbitron gradient-text">NEXUS VISION ONE</h1>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="dashboard">
                    <i class="fas fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-page="reports">
                    <i class="fas fa-file-alt"></i>
                    <span>Relatórios</span>
                </a>
                <a href="#" class="nav-item" data-page="chat">
                    <i class="fas fa-robot"></i>
                    <span>Chat IA</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Configurações</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-details">
                        <span class="user-name">Usuário</span>
                        <span class="user-role">Administrador</span>
                    </div>
                </div>
                <button class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- Conteúdo principal -->
        <main class="main-content">
            <!-- Header -->
            <header class="main-header">
                <div class="header-title">
                    <h2 id="pageTitle">Visão Geral de Segurança</h2>
                    <p id="pageSubtitle">Monitoramento em tempo real de ameaças cibernéticas</p>
                </div>

                <div class="header-actions">
                    <button class="relative p-2 rounded-full hover:bg-gray-800 text-gray-400">
                        <i class="fas fa-bell"></i>
                        <span class="notification-dot"></span>
                    </button>

                    <button class="btn-outline flex items-center space-x-2">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Login</span>
                    </button>
                </div>
            </header>

            <!-- Conteúdo das páginas (será carregado dinamicamente) -->
            <div class="page-content" id="pageContent">
                <!-- Conteúdo inicial (dashboard) será carregado aqui -->
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
